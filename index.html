<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giphy GIF Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <section class="app-card mx-auto p-4 p-md-5">
      <h1 class="text-center mb-2">Giphy GIF Finder</h1>
      <p class="text-center text-secondary mb-4">Search for a GIF and find one that fits your mood.</p>
      <form id="search-form" class="row g-2 mb-4">
        <div class="col-12 col-md-9">
          <label for="search-input" class="form-label">What GIF are you looking for?</label>
          <input id="search-input" class="form-control" type="search" placeholder="Try basketball, cats, or funny" required>
        </div>
        <div class="col-12 col-md-3 d-flex align-items-end">
          <button id="fetch-button" class="btn btn-primary w-100" type="submit">Fetch GIFs</button>
        </div>
      </form>
      <p id="status" class="text-center" role="status" aria-live="polite"></p>
      <div id="gif-container" class="row g-3" aria-label="GIF search results"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
